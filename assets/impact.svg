<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180">
  <style>
    .sans { font-family: 'Inter', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .num { font-size: 38px; font-weight: 800; fill: #FFFFFF; }
    .lbl { font-size: 13px; fill: #94A3B8; letter-spacing: 0.4px; }
    .tile { opacity: 0; animation: rise 0.6s ease-out forwards; }
    @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
    .card { transition: none; }
    .shine { animation: shine 3.5s ease-in-out infinite; }
    @keyframes shine { 0%, 100% { stroke-opacity: 0.3; } 50% { stroke-opacity: 0.9; } }
  </style>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Tile 1 -->
  <g class="tile sans" style="animation-delay:0.2s">
    <rect class="shine" x="6" y="6" width="200" height="168" rx="14" fill="#0B1220" stroke="#2563EB"/>
    <text x="26" y="66" class="num">1.00</text>
    <text x="26" y="96" class="lbl">MCP AGENT REWARD</text>
    <rect x="26" y="128" width="160" height="6" rx="3" fill="#1E293B"/>
    <rect x="26" y="128" width="0" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" from="0" to="160" begin="0.6s" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </rect>
  </g>

  <!-- Tile 2 -->
  <g class="tile sans" style="animation-delay:0.4s">
    <rect class="shine" x="218" y="6" width="200" height="168" rx="14" fill="#0B1220" stroke="#2563EB" style="animation-delay:0.8s"/>
    <text x="238" y="66" class="num">96%</text>
    <text x="238" y="96" class="lbl">CV MODEL ACCURACY</text>
    <rect x="238" y="128" width="160" height="6" rx="3" fill="#1E293B"/>
    <rect x="238" y="128" width="0" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" from="0" to="153.6" begin="0.8s" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </rect>
  </g>

  <!-- Tile 3 -->
  <g class="tile sans" style="animation-delay:0.6s">
    <rect class="shine" x="430" y="6" width="200" height="168" rx="14" fill="#0B1220" stroke="#2563EB" style="animation-delay:1.6s"/>
    <text x="450" y="66" class="num">~80%</text>
    <text x="450" y="96" class="lbl">LESS MANUAL REVIEW</text>
    <rect x="450" y="128" width="160" height="6" rx="3" fill="#1E293B"/>
    <rect x="450" y="128" width="0" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" from="0" to="128" begin="1.0s" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </rect>
  </g>

  <!-- Tile 4 -->
  <g class="tile sans" style="animation-delay:0.8s">
    <rect class="shine" x="642" y="6" width="200" height="168" rx="14" fill="#0B1220" stroke="#2563EB" style="animation-delay:2.4s"/>
    <text x="662" y="66" class="num">58K</text>
    <text x="662" y="96" class="lbl">IMAGES HAND-LABELED</text>
    <rect x="662" y="128" width="160" height="6" rx="3" fill="#1E293B"/>
    <rect x="662" y="128" width="0" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" from="0" to="160" begin="1.2s" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </rect>
  </g>
</svg>
